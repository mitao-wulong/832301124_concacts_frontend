<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通讯录管理系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>通讯录管理系统</h1>
        
        <!-- 表单部分 -->
        <div class="form-section">
            <h2>添加/编辑联系人</h2>
            <form id="contact-form">
                <input type="hidden" id="contact-id">
                <div class="form-group">
                    <label for="name">姓名 *</label>
                    <input type="text" id="name" required placeholder="请输入姓名">
                </div>
                <div class="form-group">
                    <label for="phone">电话</label>
                    <input type="tel" id="phone" placeholder="请输入电话号码">
                </div>
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" placeholder="请输入邮箱地址">
                </div>
                <div class="form-group">
                    <label for="address">地址</label>
                    <textarea id="address" placeholder="请输入地址"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" id="submit-btn">添加联系人</button>
                    <button type="button" id="cancel-btn" style="display: none;">取消</button>
                </div>
            </form>
        </div>
        
        <!-- 联系人列表 -->
        <div class="list-section">
            <h2>联系人列表</h2>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="搜索联系人...">
            </div>
            <div id="contacts-list">
                <p class="loading">加载中...</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
